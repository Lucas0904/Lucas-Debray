<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La bastide</title>
<meta name="theme-color" content="#F2F3EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151A18" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bastide">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Une seule colonne : liste plate, onglets collants pour filtrer par moment */
:root {
  --bg: #F2F3EF; --surface: #FFFFFF; --fg: #1E2522; --muted: #66706A; --line: #D9DDD5;
  --accent: #3C6A7D; --accent-fg: #FFFFFF; --ok: #4F7A55; --danger: #A33A2B;
  --soir-bg: #F6E7C8; --soir-fg: #6B4A0B;
  --matin-bg: #D8E6EE; --matin-fg: #1E4A62;
  --ger-bg: #E3E1F1; --ger-fg: #44366F;
  --dep-bg: #F3DAD3; --dep-fg: #7A2E1E;
  --font-display: "Instrument Serif", Georgia, "Times New Roman", serif;
  --font-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151A18; --surface: #1D2421; --fg: #E8ECE8; --muted: #98A39C; --line: #2F3834;
    --accent: #7FB0C4; --accent-fg: #10181B; --ok: #7FB587; --danger: #E58A7B;
    --soir-bg: #3A2F14; --soir-fg: #F0CE8A;
    --matin-bg: #1B3340; --matin-fg: #A9D0E3;
    --ger-bg: #2C2745; --ger-fg: #CBC2F0;
    --dep-bg: #3E211B; --dep-fg: #F0B3A5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151A18; --surface: #1D2421; --fg: #E8ECE8; --muted: #98A39C; --line: #2F3834;
  --accent: #7FB0C4; --accent-fg: #10181B; --ok: #7FB587; --danger: #E58A7B;
  --soir-bg: #3A2F14; --soir-fg: #F0CE8A;
  --matin-bg: #1B3340; --matin-fg: #A9D0E3;
  --ger-bg: #2C2745; --ger-fg: #CBC2F0;
  --dep-bg: #3E211B; --dep-fg: #F0B3A5;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: calc(24px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(48px + env(safe-area-inset-bottom, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.wrap { max-width: 640px; margin: 0 auto; }

.frac { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.1; font-variant-numeric: tabular-nums; vertical-align: middle; }
.frac > span:first-child { border-bottom: 1.5px solid currentColor; padding: 0 .3em 1px; }
.frac > span:last-child { padding: 1px .3em 0; }

header { display: grid; gap: 14px; margin-bottom: 18px; }
.head-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: 48px; line-height: 1; margin: 4px 0 0; }
.date { color: var(--muted); font-size: 14px; margin: 6px 0 0; }
.date::first-letter { text-transform: uppercase; }
.tools { display: flex; gap: 6px; flex: none; }
.icon-btn { width: 40px; height: 40px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; padding: 0; }
.icon-btn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.progress { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; }
.progress .figure { font-size: 17px; font-weight: 600; }
.progress .label { display: block; font-size: 12px; color: var(--muted); font-weight: 400; text-align: center; margin-top: 2px; }
.bar { height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--ok); border-radius: 99px; transition: width .35s ease; }
.sync { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.sync::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.sync.on::before { background: var(--ok); }

nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 8px; margin-bottom: 8px; }
.tabs-scroll { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.tabs-scroll::-webkit-scrollbar { display: none; }
.tab { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 9px 14px; min-height: 40px; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; }
.tab .n { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--muted); }
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.tab[aria-pressed="true"] .n { color: inherit; opacity: .85; }

.status { font-size: 14px; color: var(--danger); margin: 0 0 8px; }
.status:empty { display: none; }
.toast { font-size: 14px; color: var(--ok); margin: 0 0 8px; }
.toast:empty { display: none; }
.notice { background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; padding: 18px; color: var(--muted); font-size: 15px; display: grid; gap: 12px; }
.notice b { color: var(--fg); }
.notice code { font-size: 13px; background: var(--bg); padding: 1px 5px; border-radius: 4px; }

ul.list { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.task + .task { border-top: 1px solid var(--line); }
.row { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; gap: 4px; padding: 4px 10px 4px 4px; min-height: 52px; }
.chk { width: 44px; height: 44px; display: grid; place-items: center; background: none; border: 0; padding: 0; }
.chk .box { width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--muted); display: grid; place-items: center; transition: background .15s, border-color .15s; }
.chk svg { width: 14px; height: 14px; stroke: var(--accent-fg); fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
.chk[aria-pressed="true"] .box { background: var(--ok); border-color: var(--ok); }
.chk[aria-pressed="true"] svg { opacity: 1; }
.txt { min-width: 0; padding-block: 6px; overflow-wrap: anywhere; }
.task.done .txt { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
.chip { border-radius: 99px; padding: 7px 12px; font-size: 13px; font-weight: 600; min-height: 34px; white-space: nowrap; background: transparent; color: var(--muted); border: 1px dashed var(--line); }
.chip.soir { background: var(--soir-bg); color: var(--soir-fg); border-color: transparent; }
.chip.matin { background: var(--matin-bg); color: var(--matin-fg); border-color: transparent; }
.chip.geraldine { background: var(--ger-bg); color: var(--ger-fg); border-color: transparent; }
.chip.depart { background: var(--dep-bg); color: var(--dep-fg); border-color: transparent; }
.task.done .chip { opacity: .55; }
.panel { padding: 4px 12px 14px 48px; display: grid; gap: 10px; }
.panel .opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { border: 1px solid var(--line); background: var(--bg); border-radius: 99px; padding: 8px 14px; min-height: 40px; font-size: 14px; font-weight: 500; }
.opt[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.danger-row { display: flex; gap: 8px; flex-wrap: wrap; }
.link-btn { background: none; border: 0; padding: 8px 2px; font-size: 14px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; min-height: 40px; }
.link-btn.danger { color: var(--danger); }

form.add { margin-top: 28px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 10px; }
form.add h2 { font-family: var(--font-display); font-weight: 400; font-size: 22px; margin: 0; }
form.add .fields { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.field { width: 100%; min-height: 46px; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 16px; }
.btn { min-height: 46px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-fg); font-weight: 600; padding: 10px 16px; }
.btn:disabled { opacity: .5; cursor: default; }
.btn.secondary { background: var(--bg); color: var(--fg); border: 1px solid var(--line); }
.hint { margin: 0; font-size: 13px; color: var(--muted); }
@media (min-width: 560px) { form.add .fields { grid-template-columns: minmax(0, 1fr) auto; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="head-top">
      <div>
        <div class="eyebrow">Remise en état</div>
        <h1>La bastide</h1>
        <p class="date" id="date"></p>
      </div>
      <div class="tools">
        <button type="button" class="icon-btn" id="shareBtn" aria-label="Partager le lien de la liste" title="Partager le lien" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>
        </button>
        <button type="button" class="icon-btn" id="themeBtn" aria-label="Thème" title="Thème"></button>
      </div>
    </div>
    <div class="progress" aria-live="polite" id="progress" hidden>
      <div class="figure" id="figure"></div>
      <div class="bar" role="progressbar" aria-label="Avancement" aria-valuemin="0" aria-valuemax="100" id="pbar"><i id="pfill"></i></div>
    </div>
    <div class="sync" id="sync" hidden></div>
  </header>

  <nav class="tabs" aria-label="Filtrer les tâches" id="tabsNav" hidden>
    <div class="tabs-scroll" id="tabs"></div>
  </nav>

  <p class="toast" id="toast" role="status"></p>
  <p class="status" id="status" role="alert"></p>
  <div id="content"><div class="notice">Chargement…</div></div>

  <form class="add" id="addForm" hidden>
    <h2>Ajouter une tâche</h2>
    <div class="fields">
      <input class="field" id="newText" type="text" maxlength="140" autocomplete="off" enterkeyhint="done" placeholder="Ex. Nettoyer la hotte" aria-label="Nouvelle tâche">
      <button class="btn" type="submit" id="addBtn">Ajouter</button>
    </div>
    <p class="hint" id="addHint"></p>
  </form>
</div>

<script src="config.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
  collection, doc, addDoc, updateDoc, deleteDoc, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const WHEN = [{ k: "soir", l: "Ce soir" }, { k: "matin", l: "Demain matin" }, { k: "geraldine", l: "Géraldine" }, { k: "depart", l: "Au départ" }];
const TABS = [{ k: "tout", l: "Tout" }, ...WHEN, { k: "aucun", l: "À répartir" }];
const LIST_KEY = "bastide-liste", THEME_KEY = "bastide-theme", TAB_KEY = "bastide-onglet";

let tasks = [], coll = null, loaded = false, online = false, openId = null, confirmId = null, errMsg = "", setupMsg = "";
let tab = "tout";
const pending = {};

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const frac = (n, d, label) => `<span class="frac" aria-label="${n} ${label || "sur"} ${d}"><span>${n}</span><span>${d}</span></span>`;
const whenLabel = (k) => (WHEN.find((w) => w.k === k) || {}).l || "";
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

try { $("date").textContent = new Date().toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" }); } catch {}
if (TABS.some((T) => T.k === store.get(TAB_KEY))) tab = store.get(TAB_KEY);

/* ---------- Thème : auto → clair → sombre ---------- */
const THEMES = ["auto", "light", "dark"];
const THEME_LABEL = { auto: "Thème automatique", light: "Thème clair", dark: "Thème sombre" };
const THEME_ICON = {
  auto: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>',
  light: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  dark: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>',
};
let theme = THEMES.includes(store.get(THEME_KEY)) ? store.get(THEME_KEY) : "auto";
function applyTheme() {
  if (theme === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", theme);
  $("themeBtn").innerHTML = THEME_ICON[theme];
  $("themeBtn").setAttribute("aria-label", THEME_LABEL[theme] + " (toucher pour changer)");
  $("themeBtn").title = THEME_LABEL[theme];
}
$("themeBtn").addEventListener("click", () => {
  theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
  store.set(THEME_KEY, theme); applyTheme();
});
applyTheme();

/* ---------- Code de la liste (dans le lien, après #) ---------- */
const validCode = (c) => typeof c === "string" && /^[a-z0-9]{16,40}$/.test(c);
function newCode() {
  const a = "abcdefghijkmnopqrstuvwxyz23456789", r = new Uint8Array(20);
  crypto.getRandomValues(r);
  return Array.from(r, (x) => a[x % a.length]).join("");
}
function codeFromUrl() {
  const m = location.hash.match(/(?:^#|&)l=([a-z0-9]+)/);
  return m && validCode(m[1]) ? m[1] : null;
}
const shareUrl = (code) => location.origin + location.pathname + "#l=" + code;

/* ---------- Rendu ---------- */
function flash(msg) {
  $("toast").textContent = msg;
  clearTimeout(flash.t); flash.t = setTimeout(() => { $("toast").textContent = ""; }, 3500);
}

function render() {
  const ready = loaded && coll;
  $("progress").hidden = $("tabsNav").hidden = $("addForm").hidden = !ready;
  $("shareBtn").hidden = !coll;
  $("sync").hidden = !coll;
  $("sync").className = "sync" + (online ? " on" : "");
  $("sync").textContent = online ? "Synchronisé en direct" : "Hors ligne : les changements partiront au retour du réseau";
  $("status").textContent = errMsg;

  if (!coll) { $("content").innerHTML = setupMsg; return; }

  const total = tasks.length, done = tasks.filter((t) => t.done).length;
  $("figure").innerHTML = total ? frac(done, total, "faites sur") + '<span class="label">faites</span>' : '<span class="label">Aucune tâche</span>';
  const pct = total ? Math.round(done * 100 / total) : 0;
  $("pfill").style.width = pct + "%";
  $("pbar").setAttribute("aria-valuenow", String(pct));

  $("tabs").innerHTML = TABS.map((T) => {
    const n = tasks.filter((t) => !t.done && matches(t, T.k)).length;
    return `<button type="button" class="tab" data-k="${T.k}" aria-pressed="${tab === T.k}">${esc(T.l)} <span class="n" aria-label="${n} restantes">${n}</span></button>`;
  }).join("");

  const shown = tasks.filter((t) => matches(t, tab));
  let html;
  if (!loaded) html = '<div class="notice">Chargement de la liste…</div>';
  else if (!total) html = '<div class="notice">Aucune tâche pour l’instant. Ajoutez la première avec le formulaire ci-dessous.</div>';
  else if (!shown.length) html = `<div class="notice">${tab === "aucun" ? "Toutes les tâches sont réparties." : "Rien n’est prévu pour « " + esc(whenLabel(tab)) + " » pour l’instant. Ajoutez une tâche ci-dessous, ou touchez l’étiquette d’une tâche dans « Tout » pour changer son moment."}</div>`;
  else {
    const items = shown.slice().sort((a, b) => (a.done ? 1 : 0) - (b.done ? 1 : 0) || a.n - b.n);
    html = '<ul class="list">' + items.map(rowHtml).join("") + "</ul>";
  }
  $("content").innerHTML = html;

  const tw = whenLabel(tab);
  $("addHint").textContent = tw ? `La tâche sera rangée dans « ${tw} ».` : "Elle ira dans « À répartir » ; vous pourrez lui donner un moment ensuite.";
}

function matches(t, k) {
  if (k === "tout") return true;
  if (k === "aucun") return !t.when;
  return t.when === k;
}

function rowHtml(t) {
  const open = openId === t.id;
  let h = `<li class="task${t.done ? " done" : ""}" data-id="${esc(t.id)}"><div class="row">` +
    `<button type="button" class="chk" data-act="toggle" aria-pressed="${t.done}" aria-label="${t.done ? "Remettre à faire" : "Marquer faite"} : ${esc(t.t)}"><span class="box"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5"/></svg></span></button>` +
    `<div class="txt">${esc(t.t)}</div>` +
    `<button type="button" class="chip ${esc(t.when)}" data-act="open" aria-expanded="${open}">${esc(t.when ? whenLabel(t.when) : "À répartir")}</button></div>`;
  if (open) {
    h += '<div class="panel"><div class="opts" role="group" aria-label="Moment">' +
      WHEN.map((w) => `<button type="button" class="opt" data-act="assign" data-v="${w.k}" aria-pressed="${t.when === w.k}">${esc(w.l)}</button>`).join("") +
      `<button type="button" class="opt" data-act="assign" data-v="" aria-pressed="${!t.when}">À répartir</button></div><div class="danger-row">` +
      (confirmId === t.id
        ? '<button type="button" class="link-btn danger" data-act="del-yes">Oui, supprimer</button><button type="button" class="link-btn" data-act="del-no">Annuler</button>'
        : '<button type="button" class="link-btn danger" data-act="del">Supprimer cette tâche</button>') +
      "</div></div>";
  }
  return h + "</li>";
}

const find = (id) => tasks.find((t) => t.id === id) || null;

function write(id, fn) {
  if (!coll || pending[id]) return;
  pending[id] = true; errMsg = "";
  Promise.resolve().then(fn).catch((e) => {
    console.error(e);
    errMsg = "Modification refusée par le serveur. Recharge la page et réessaie.";
    render();
  }).finally(() => { delete pending[id]; });
}

/* ---------- Actions ---------- */
$("content").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-act]");
  if (!b) return;
  const act = b.dataset.act;
  if (act === "create") { startList(newCode(), true); return; }
  const li = b.closest(".task"), id = li && li.dataset.id, t = id && find(id);
  if (!t) return;
  if (act === "toggle") write(id, () => updateDoc(doc(coll, id), { done: !t.done }));
  else if (act === "open") { openId = openId === id ? null : id; confirmId = null; render(); }
  else if (act === "assign") { openId = null; write(id, () => updateDoc(doc(coll, id), { when: b.dataset.v })); }
  else if (act === "del") { confirmId = id; render(); }
  else if (act === "del-no") { confirmId = null; render(); }
  else if (act === "del-yes") { openId = confirmId = null; write(id, () => deleteDoc(doc(coll, id))); }
});

$("tabs").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-k]");
  if (!b) return;
  tab = b.dataset.k; store.set(TAB_KEY, tab); openId = confirmId = null; render();
});

$("addForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const input = $("newText"), text = input.value.trim();
  if (!text || !coll) return;
  const when = WHEN.some((w) => w.k === tab) ? tab : "";
  errMsg = "";
  // Pas d'attente du serveur : la tâche apparaît tout de suite et part dès que le réseau le permet.
  addDoc(coll, { t: text.slice(0, 140), when, done: false, n: Date.now() })
    .catch((err) => { console.error(err); errMsg = "La tâche n’a pas pu être enregistrée. Réessaie."; render(); });
  input.value = ""; input.focus();
});

$("shareBtn").addEventListener("click", async () => {
  const url = shareUrl(listCode);
  if (navigator.share) {
    try { await navigator.share({ title: "La bastide", text: "Notre liste pour remettre la bastide au propre", url }); return; }
    catch (e) { if (e && e.name === "AbortError") return; }
  }
  try { await navigator.clipboard.writeText(url); flash("Lien copié. Envoie-le par SMS ou WhatsApp."); }
  catch { prompt("Copie ce lien et envoie-le :", url); }
});

/* ---------- Démarrage ---------- */
const cfg = window.FIREBASE_CONFIG || {};
let db = null, listCode = null, unsub = null;

function startList(code, isNew) {
  listCode = code;
  store.set(LIST_KEY, code);
  if (location.hash !== "#l=" + code) history.replaceState(null, "", "#l=" + code);
  if (unsub) unsub();
  tasks = []; loaded = false; online = false;
  coll = collection(db, "listes", code, "taches");
  render();
  unsub = onSnapshot(coll, { includeMetadataChanges: true }, (snap) => {
    tasks = snap.docs.map((d) => {
      const o = d.data() || {};
      return { id: d.id, t: String(o.t || ""), when: WHEN.some((w) => w.k === o.when) ? o.when : "", done: !!o.done, n: typeof o.n === "number" ? o.n : 0 };
    });
    online = !snap.metadata.fromCache;
    if (openId && !find(openId)) openId = confirmId = null;
    loaded = true; render();
  }, (err) => {
    console.error(err);
    loaded = true;
    errMsg = err && err.code === "permission-denied"
      ? "Accès refusé par la base. Vérifie les règles Firestore (voir le guide d’installation)."
      : "Synchronisation interrompue. Recharge la page pour reprendre.";
    render();
  });
  if (isNew) flash("Liste créée. Touche le bouton de partage en haut pour envoyer le lien.");
}

if (!cfg.projectId || !cfg.apiKey) {
  setupMsg = '<div class="notice"><b>Base de données pas encore branchée.</b><span>Il reste à coller la configuration Firebase dans le fichier <code>config.js</code>. Suis le guide d’installation (fichier <code>README.md</code>).</span></div>';
  render();
} else {
  try {
    const app = initializeApp(cfg);
    db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
  } catch (e) {
    console.error(e);
    try { db = initializeFirestore(initializeApp(cfg, "secours"), {}); } catch (e2) { console.error(e2); }
  }
  const code = codeFromUrl() || (validCode(store.get(LIST_KEY)) ? store.get(LIST_KEY) : null);
  if (!db) {
    setupMsg = '<div class="notice"><b>Connexion impossible.</b><span>La configuration de <code>config.js</code> semble incorrecte.</span></div>';
    render();
  } else if (code) {
    startList(code, false);
  } else {
    setupMsg = '<div class="notice"><b>Bienvenue.</b><span>Si on t’a envoyé un lien vers la liste, ouvre ce lien complet : il contient le code de la liste.</span><span>Sinon, crée la liste, puis partage son lien avec le bouton en haut à droite.</span><button type="button" class="btn" data-act="create">Créer la liste</button></div>';
    render();
  }
}

window.addEventListener("hashchange", () => {
  const c = codeFromUrl();
  if (db && c && c !== listCode) startList(c, false);
});
</script>
